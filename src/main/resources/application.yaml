spring:
  application:
    name: resibo

server:
  port: ${SERVER_PORT:8080}

# Actuator exposes /actuator/health for infrastructure probes.
# The application's own contract endpoint is /api/health/check (HealthController),
# which returns the standard ResponseDto envelope.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.api.resibo: INFO

name: Resibo CI

# `main` holds only the README, so it is deliberately not a trigger here.
# All application work lands on dev/api/resibo — see resibo-plan.md §7.1.
on:
  push:
    branches: [dev/api/resibo]
  pull_request:
    branches: [dev/api/resibo]
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is deliberately scoped to the deploy job, NOT the whole
# workflow. Serialising everything means one deploy waiting on an unavailable
# runner holds the group open, and every later run is cancelled as stale
# pending — so a perfectly good build never reports a result.
# Build and test must always be free to run and report.

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # The real database lives on a private network that GitHub-hosted runners
    # cannot reach, so the build gets a throwaway MariaDB of its own. Same
    # approach as gainsoclock's workflow.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: resibo_test
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Throwaway credentials for a container that exists for one job. These are
    # not secrets and deliberately are not GitHub Secrets — nothing is gained by
    # hiding the password to a database that is destroyed minutes later.
    env:
      DATASOURCE_URL: jdbc:mariadb://localhost:3306/resibo_test
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: test
      SERVER_PORT: '8080'

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Tests run here, on a clean machine, before anything touches the
      # server. The deploy job rebuilds the image from source on the server;
      # this job is the gate, not the artifact producer.
      - name: Build and test
        run: bash ./mvnw -B clean verify


  deploy:
    name: Deploy to server
    # Only on a real push to the working branch — never from a pull request,
    # which would let a fork's code reach the server.
    # Three guards, all required:
    #  - never from a pull request, which would let a fork's code reach the server
    #  - only the working branch
    #  - DEPLOY_ENABLED must be set to 'true' as a repository variable
    #
    # The last one exists because a job whose labels match no runner does not
    # fail — it sits queued for up to 24 hours, leaving the whole run amber and
    # hiding a perfectly good build. Skipping is honest and visible.
    # Turn it on once the self-hosted runner is registered:
    #   Settings → Secrets and variables → Actions → Variables → DEPLOY_ENABLED = true
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/dev/api/resibo'
      && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: [self-hosted, resibo-deploy]

    # Serialise deploys only. Two deploys at once would race for the same
    # container and image tags; cancel-in-progress stays false so a running
    # deploy is never killed between promoting and health-gating an image.
    concurrency:
      group: resibo-deploy-${{ github.ref }}
      cancel-in-progress: false

    # Without a bound, a job with no matching runner sits queued for up to
    # 24 hours. Fail in minutes instead, so the reason is obvious.
    timeout-minutes: 20

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      # deploy.sh builds the image, promotes it, health-gates it and rolls
      # back on failure. It is the same script used for manual deploys, so
      # CI and a human do exactly the same thing.
      - name: Deploy
        run: bash scripts/deploy.sh
        env:
          APP_DIR: /opt/resibo
          HOST_PORT: '8083'
          APP_ENV: prod

      - name: Report what is running
        if: always()
        run: |
          docker ps --filter name=resibo-api \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

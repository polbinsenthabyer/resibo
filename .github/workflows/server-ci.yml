name: Resibo Server CI

# Backend only. The `paths` filter is what keeps the two halves independent:
# a commit that touches only client/ never starts this workflow, so the API
# image is not rebuilt and the container is not restarted. See
# resibo-plan.md §7.4.
#
# Anything listed here is a backend build input. A file in neither workflow's
# paths will never trigger a deploy — correct for docs, a silent problem for a
# real input, so add new ones deliberately.
on:
  push:
    branches: [dev/resibo]
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - 'scripts/deploy.sh'
      - 'scripts/rollback.sh'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [dev/resibo]
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - 'scripts/deploy.sh'
      - 'scripts/rollback.sh'
      - '.github/workflows/server-ci.yml'
  # Ignores the paths filter, so a deploy can always be forced by hand.
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is deliberately scoped to the deploy job, NOT the whole
# workflow. Serialising everything means one deploy waiting on an unavailable
# runner holds the group open, and every later run is cancelled as stale
# pending — so a perfectly good build never reports a result.

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    # The real database lives on a private network that GitHub-hosted runners
    # cannot reach, so the build gets a throwaway MariaDB of its own. Same
    # approach as gainsoclock's workflow.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: resibo_test
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Throwaway credentials for a container that exists for one job. These are
    # not secrets and deliberately are not GitHub Secrets — nothing is gained by
    # hiding the password to a database that is destroyed minutes later.
    env:
      DATASOURCE_URL: jdbc:mariadb://localhost:3306/resibo_test
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: test
      SERVER_PORT: '8080'
      # jwt.secret has no default, so the Spring context will not start
      # without this and every @SpringBootTest fails. Throwaway value for a
      # throwaway job — it signs nothing that leaves this runner, and is
      # deliberately not a GitHub Secret for the same reason as the database
      # password above.
      JWT_SECRET: ci-only-signing-key-not-used-anywhere-else-0123456789
      JWT_EXPIRATION: '28800000'

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          # The pom moved under server/, so the cache key has to follow it or
          # the dependency cache silently never hits.
          cache-dependency-path: server/pom.xml

      # Tests run here, on a clean machine, before anything touches the
      # server. The deploy job rebuilds the image from source on the server;
      # this job is the gate, not the artifact producer.
      - name: Build and test
        run: bash ./mvnw -B clean verify

  deploy:
    name: Deploy API to server
    # Only on a real push to the working branch — never from a pull request,
    # which would let a fork's code reach the server.
    # Three guards, all required:
    #  - never from a pull request
    #  - only the working branch
    #  - DEPLOY_ENABLED must be set to 'true' as a repository variable
    #
    # The last one exists because a job whose labels match no runner does not
    # fail — it sits queued for up to 24 hours, leaving the whole run amber and
    # hiding a perfectly good build. Skipping is honest and visible.
    #
    # ⚠️ No runner carries the `resibo-deploy` label today. The only runner on
    # the server is registered to the gainsoclock repository with the label
    # `gainsoclock-deploy`, so this job cannot run until a runner is
    # registered for this repository. Until then, deploys are the manual
    # procedure in resibo-plan.md §7.3.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/dev/resibo'
      && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: [self-hosted, resibo-deploy]

    # Serialise deploys only. Two deploys at once would race for the same
    # container and image tags; cancel-in-progress stays false so a running
    # deploy is never killed between promoting and health-gating an image.
    concurrency:
      group: resibo-deploy-${{ github.ref }}
      cancel-in-progress: false

    # Without a bound, a job with no matching runner sits queued for up to
    # 24 hours. Fail in minutes instead, so the reason is obvious.
    timeout-minutes: 20

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      # deploy.sh builds the image, promotes it, health-gates it and rolls
      # back on failure. It is the same script used for manual deploys, so
      # CI and a human do exactly the same thing.
      - name: Deploy
        run: bash scripts/deploy.sh
        env:
          APP_DIR: /opt/resibo
          HOST_PORT: '8083'
          APP_ENV: prod

      - name: Report what is running
        if: always()
        run: |
          docker ps --filter name=resibo-api \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

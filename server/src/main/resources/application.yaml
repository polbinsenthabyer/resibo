spring:
  application:
    name: resibo
  # Loads a per-environment env file from the project root, e.g. .env.dev.
  # APP_ENV selects which one — set APP_ENV=prod on the server to load .env.prod;
  # it defaults to dev so a local checkout needs no extra setup.
  # "optional:" means the app still starts if the file is absent, using the
  # defaults below. All .env.* files are git-ignored except .env.example.
  config:
    import: optional:file:.env.${APP_ENV:dev}[.properties]

  # No defaults here on purpose. If the datasource values are missing the
  # application fails to start with a clear message, which is far safer than
  # silently falling back to some other database.
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: resibo-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      # Fail fast rather than hanging a checkout request when the database
      # is unreachable — the till must find out immediately, not eventually.
      connection-timeout: 10000

  jpa:
    hibernate:
      # none — Hibernate never creates, alters or drops anything. The schema is
      # owned outside the application (same arrangement as gainsoclock).
      # This is not merely a preference: if Resibo ends up issuing BIR-registered
      # receipts, an ORM silently altering the sales tables is exactly the class
      # of change that breaks an audit trail. Do not set this to update/create.
      ddl-auto: none
    # Keeps the persistence context out of the view layer. Without this,
    # connections are held for the whole request and lazy loads happen during
    # serialisation, which is the usual cause of mystery pool exhaustion.
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

# Comma-separated origins allowed to call this API from a browser.
#
# The default is the real list, not "*", and that is deliberate: an
# environment that forgets to set CORS_ALLOWED_ORIGINS should fail closed, not
# open. A wildcard default is the kind of silently-wrong setting that survives
# to production because nothing complains about it — the same reasoning that
# keeps the datasource properties defaultless.
#
#   https://resibo.polbinsenthabyer.uk   the deployed client
#   http://localhost:5173                the Vite dev server
#   http://127.0.0.1:5173                the same server, different origin to
#                                        a browser, so both have to be named
#
# localhost is in the PRODUCTION list on purpose: the client defaults to
# calling the deployed API (see client/src/config/env.ts), so `npm run dev`
# with no backend running is a cross-origin call from localhost to this host.
# Drop those two entries and that workflow stops working.
#
# Setting "*" still works and still disables credentials — see SecurityConfig.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://resibo.polbinsenthabyer.uk,http://localhost:5173,http://127.0.0.1:5173}

# No default for the secret, deliberately: a hardcoded fallback would mean
# every environment that forgot to set one shares a signing key an attacker
# can read in the repository. Startup fails instead.
jwt:
  secret: ${JWT_SECRET}
  # Milliseconds. 28800000 = 8 hours, roughly one shift on a till.
  expiration: ${JWT_EXPIRATION:28800000}

# Actuator exposes /actuator/health for infrastructure probes.
# The application's own contract endpoint is /api/health/check (HealthController),
# which returns the standard ResponseDto envelope.
# With the datasource present, /actuator/health now also reflects database
# reachability — details stay hidden from anonymous callers.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.api.resibo: INFO
